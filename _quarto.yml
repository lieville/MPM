project:
  type: book
  output-dir: docs
  execute-dir: project
  
lang: zh

execute:
  enabled: true
  cache: true
  freeze: auto
  warning: false
  engine: knitr  # 统一使用 knitr，通过 reticulate 调用 Python

# 配置 Python 路径（GitHub Actions 中无效，仅本地使用）
knitr:
  opts_chunk: 
    R.options:
      reticulate.python: "c/data/anaconda/python.exe"  

book:
  title: "现代预测建模：从回归到机器学习"
  author: "李世纪"
  date: "2025-11-26"

  chapters: 
    - index.qmd
    - intro.qmd
    - part: "I 基础-线性回归模型"
      chapters:
        - chapters/part-1-introduction.qmd
        - chapters/1预测模型与评估.qmd
        - chapters/2线性回归.qmd
        - chapters/3残差分析.qmd
        - chapters/4自相关.qmd
    - part: "II 扩展——线性分析方法"
      chapters:
        - chapters/part-2-introduction.qmd
        - chapters/5降维.qmd
        - chapters/6正则化.qmd
        - chapters/7广义线性模型.qmd
        - chapters/8线性分类模型.qmd
        - chapters/9非线性回归与样条回归.qmd
    - part: "III 进阶——超越线性的机器学习"
      chapters:
        - chapters/part-3-introduction.qmd
        - chapters/10决策树与集成学习.qmd
        - chapters/11支持向量机.qmd
        - chapters/12神经网络与深度学习基础.qmd
    - part: "IV 实践——综合案例分析"
      chapters:   
        - chapters/part-4-introduction.qmd     
        - chapters/13回归任务与基准测试.qmd
        - chapters/14分类任务.qmd
        - chapters/15案例综合分析.qmd        

bibliography: references.bib

format:
  html:
    toc: true
    toc-depth: 2
    theme: cosmo
    code-link: true
    code-line-numbers: true
    number-sections: false
    css: science-textbook.css
    mainfont: "Microsoft YaHei"
    monofont: "Consolas"
    
  docx:
    toc: true
    toc-depth: 2
    number-sections: false
    
  pdf:
    documentclass: ctexbook
    classoption: ["openany"]
    toc-depth: 2
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=3cm
      - right=2.5cm
      - headheight=15pt
    mainfont: Times New Roman
    sansfont: Arial
    monofont: Courier New
    fontsize: 11pt
    linestretch: 1.25
    pdf-engine: xelatex
    include-in-header:
      text: |
        \usepackage{ctex}
        \setCJKmainfont{SimSun}
    number-sections: false

editor: source