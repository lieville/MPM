on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 安装 R 4.5.2
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      # 安装 R 包并配置（关键修复）
      - name: Install R packages and configure reticulate
        run: |
          Rscript -e 'install.packages(c("rmarkdown", "downlit", "xml2", "knitr", "reticulate"), repos="https://cloud.r-project.org/")'
          Rscript -e 'library(reticulate); reticulate::use_python("/usr/bin/python3", required = TRUE)'

      # 安装 Python 3.14
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: |
          pip install jupyter numpy pandas scikit-learn matplotlib seaborn

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}