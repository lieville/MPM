on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 先安装系统依赖
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev libxml2-dev libssl-dev libcurl4-openssl-dev

      # 安装 Python 3.12（稳定版）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install jupyter numpy pandas scikit-learn matplotlib seaborn

      # 安装 R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      # 安装 R 包
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("rmarkdown", "downlit", "xml2", "knitr", "reticulate"), repos="https://cloud.r-project.org/")'
          # 验证安装
          Rscript -e 'library(reticulate); library(knitr); library(rmarkdown)'

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}